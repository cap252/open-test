[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennpu-quant"
version = "1.0.0"
description = "Portable ONNX QDQ, power-of-two scales and fixed-encoding AdaRound"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
dependencies = ["numpy==1.26.4", "onnx==1.17.0", "PyYAML==6.0.2"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.11"]

[project.optional-dependencies]
runtime = ["onnxruntime-gpu==1.20.2; sys_platform == 'linux' and platform_machine == 'x86_64'"]
images = ["pillow==11.1.0", "opencv-python-headless==4.11.0.86", "scikit-image==0.25.2"]
coco = ["pycocotools==2.0.8"]
adaround = ["torch==2.5.1"]
data = ["datasets>=3,<4", "huggingface-hub==0.29.3", "scipy==1.15.2"]
export = ["torchvision==0.20.1", "tensorflow-cpu==2.15.1", "tf2onnx==1.16.1", "protobuf==3.20.3", "ml-dtypes==0.3.2", "onnxsim==0.4.36", "pandas==2.2.3", "seaborn==0.13.2", "thop==0.1.1.post2209072238", "ipython==8.31.0", "setuptools==80.9.0"]
cnn38 = ["timm==1.0.15", "opencv-python==4.11.0.86", "torchmetrics==0.11.4", "einops==0.8.1", "alfred-py==3.1.1", "safetensors==0.8.0", "ultralytics==8.3.0", "yacs==0.1.8", "pytorch-lightning==1.9.5", "loguru==0.7.3", "tabulate==0.9.0", "scikit-image==0.25.2"]
mmseg = ["mmcv==2.1.0", "mmengine==0.10.7", "mmsegmentation==1.2.2", "ftfy==6.3.1", "regex==2024.11.6"]
reproduction = ["torch==2.5.1", "torchvision==0.20.1", "openpyxl==3.1.5"]
dev = ["ruff==0.11.13"]

[project.scripts]
opennpu-quant = "opennpu_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opennpu_quant = ["resources/**/*.yaml", "resources/**/*.txt", "resources/**/*.json"]

[tool.ruff]
required-version = "==0.11.13"
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["F401", "F811", "F841"]
