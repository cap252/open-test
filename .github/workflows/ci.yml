name: CPU release checks
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu torchvision==0.20.1+cpu
      - run: python -m pip install '.[runtime,images,coco,reproduction,dev]' build
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - name: Check generated standalone presets
        run: python tools/build_presets.py --check
      - name: Check lightweight import
        run: |
          python - <<'PY'
          import sys
          import opennpu_quant
          assert len(opennpu_quant.__all__) == 16
          assert not {'numpy', 'onnx', 'onnxruntime', 'torch', 'tensorflow'} & set(sys.modules)
          PY
      - run: opennpu-quant demo --device cpu --adaround
      - run: opennpu-quant run --models resnet18 --conditions fp32,pot_rtn --dry-run
      - name: Build source and wheel distributions
        run: python -m build --outdir dist
      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile, zipfile
          forbidden = {'.github', 'docs', 'tests', 'tools'}
          wheels = list(Path('dist').glob('*.whl'))
          sources = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == len(sources) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              assert not any(PurePosixPath(p).parts[0] in forbidden for p in archive.namelist())
              assert 'opennpu_quant/research.py' not in archive.namelist()
              assert not any(PurePosixPath(p).name in {'research_records.py', 'build_presets.py'} for p in archive.namelist())
              recipes = [p for p in archive.namelist() if p.startswith('opennpu_quant/resources/models/') and p.endswith('.yaml')]
              assert len(recipes) == 38
              presets = {PurePosixPath(p).name for p in archive.namelist() if p.startswith('opennpu_quant/resources/experiments/') and p.endswith('.yaml')}
              assert presets == {'core10.yaml', 'cnn30.yaml'}
              assert not any('quicksrnet' in p or 'arcface' in p for p in recipes)
              for name in ('LICENSE', 'NOTICE', 'THIRD_PARTY.md'):
                  matches = [p for p in archive.namelist() if p.endswith('.dist-info/licenses/' + name)]
                  assert len(matches) == 1, name
                  assert archive.read(matches[0]) == Path(name).read_bytes()
              for name in ('posenet.txt', 'mobilefacenet.txt'):
                  resource = 'opennpu_quant/resources/licenses/' + name
                  assert archive.read(resource) == Path('src', resource).read_bytes()
          with tarfile.open(sources[0]) as archive:
              paths = [PurePosixPath(p).parts[1:] for p in archive.getnames()]
              assert not any(p and p[0] in forbidden for p in paths)
              assert ('README.md',) in paths
              presets = {p[-1] for p in paths if p[:4] == ('src', 'opennpu_quant', 'resources', 'experiments') and p[-1].endswith('.yaml')}
              assert presets == {'core10.yaml', 'cnn30.yaml'}
              assert ('src', 'opennpu_quant', 'research.py') not in paths
              assert not any(p and p[-1] in {'research_records.py', 'build_presets.py'} for p in paths)
              prefix = archive.getnames()[0].split('/')[0]
              for name in ('LICENSE', 'NOTICE', 'THIRD_PARTY.md'):
                  assert archive.extractfile(prefix + '/' + name).read() == Path(name).read_bytes()
              for name in ('posenet.txt', 'mobilefacenet.txt'):
                  resource = 'src/opennpu_quant/resources/licenses/' + name
                  assert archive.extractfile(prefix + '/' + resource).read() == Path(resource).read_bytes()
              assert not any(p and p[-1] in {'README.en.md', 'README.ko.md'} for p in paths)
          PY
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Run self-contained regressions against the installed wheel
        run: python -m unittest discover -s tests -t . -v
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          assert find_spec('opennpu_quant.research') is None
          from opennpu_quant.models.spec import ModelSpec, model_names
          from opennpu_quant.configuration import PRESETS, load_config
          names = model_names()
          assert len(names) == 38
          from opennpu_quant.reproduction.assets import catalog, select_catalog
          assert len(catalog()["entries"]) == 266
          for group, models, conditions in ((None, 30, 210), ('core10', 10, 70), ('cnn30', 30, 210), ('all', 38, 266)):
              _, entries = select_catalog(model_set=group)
              assert len(entries) == conditions
              assert len({entry['model'] for entry in entries}) == models
          assert all(ModelSpec.load(name).name == name for name in names)
          assert PRESETS == ('core10', 'cnn30')
          cnn30 = load_config('cnn30')['models']
          assert len(cnn30) == len(set(cnn30)) == 30
          assert cnn30[:10] == load_config('core10')['models']
          assert len(load_config('cnn30')['conditions']) == 7
          assert len(load_config('core10')['conditions']) == 5
          assert set(names) - set(cnn30) == {
              'efficientnet_lite0', 'yolov9_t', 'posenet_101', 'deeplabv3plus_r50_voc',
              'yolov3_full', 'yolov4_full', 'yolov7_full', 'yolov9_s',
          }
          PY
          opennpu-quant demo --device cpu --adaround
          opennpu-quant run --models resnet18 --conditions fp32,pot_rtn --dry-run
          opennpu-quant run -c cnn30 --dry-run
          opennpu-quant reproduce prepare --help
          opennpu-quant reproduce run --help
          opennpu-quant reproduce compare --help
          opennpu-quant reproduce report --help
          opennpu-quant reproduce configs --output selected-settings
